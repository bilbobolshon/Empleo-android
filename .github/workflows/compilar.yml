name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiEmpleo-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar como "Última versión"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiEmpleo.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima MiEmpleo.apk --title "Última versión" --notes "Compilada automáticamente (${GITHUB_SHA::7}). Descarga MiEmpleo.apk e instálala."
