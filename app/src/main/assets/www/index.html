<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Empleo</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="barra">
    <button id="atras" aria-label="Atrás" hidden>&#8592;</button>
    <h1 id="titulo">Mi Empleo</h1>
    <button id="adelante" aria-label="Adelante" hidden>&#8594;</button>
  </header>
  <div id="trabajo" hidden><span class="rueda-mini"></span><span class="trabajo-texto">Trabajando…</span><span class="trabajo-tiempo">0:00</span></div>
  <main id="pantalla"></main>

  <div id="carga" hidden>
    <div class="carga-caja">
      <div class="rueda"></div>
      <p id="carga-texto">Un momento…</p>
      <div class="progreso" id="carga-progreso" hidden><div id="carga-barra"></div></div>
      <p id="carga-tiempo" class="suave"></p>
      <p class="suave">Estoy trabajando: espera un momento, no hace falta que toques nada.</p>
    </div>
  </div>

  <div id="dialogo" hidden>
    <div class="dialogo-caja">
      <p id="dialogo-texto"></p>
      <div id="dialogo-botones"></div>
    </div>
  </div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="prompts.js"></script>
  <script src="cv.js"></script>
  <script src="nav.js"></script>
  <script src="fase2.js"></script>
  <script src="fase3.js"></script>
  <script src="fase4.js"></script>
  <script src="fase5.js"></script>
  <script src="fase6.js"></script>
  <script src="fase7.js"></script>
  <script src="fase8.js"></script>
  <script src="fase9.js"></script>
  <script src="fase10.js"></script>
  <script src="fase11.js"></script>
  <script src="fase12.js"></script>
  <script src="app.js"></script>
</body>
</html>
